<html lang="en">
<head>
<meta charset="utf-8">

<title>InnovoGeo home search — VA</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --ink: #1c2b24;
    --muted: #5c6b63;
    --paper: #f6f3ee;
    --line: #e4ddd2;
    --header: #1b3a2f;
    --green: #1f7a4d;
    --sage: #6f9178;
    --water: #0e7490;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", "Avenir Next", "Helvetica Neue", sans-serif;
    color: var(--ink);
    background: var(--paper);
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }
  header {
    background: var(--header);
    color: #f4f7f5;
    padding: 14px 18px 12px;
  }
  header h1 { font-size: 20px; font-weight: 650; margin: 0 0 2px; letter-spacing: -0.01em; }
  header p { margin: 0; color: #d5e4db; font-size: 13.5px; line-height: 1.4; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    align-items: center;
    margin-top: 10px;
  }
  .controls label { font-size: 13.5px; display: flex; gap: 8px; align-items: center; }
  .controls input[type="search"] {
    border: 0;
    border-radius: 999px;
    padding: 7px 12px;
    min-width: 200px;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
  }
  button.fit {
    background: transparent;
    color: #f4f7f5;
    border: 1px solid #8faf9d;
    border-radius: 999px;
    padding: 6px 12px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  button.fit:hover { background: rgba(255,255,255,0.08); }
  .layout { flex: 1; display: flex; min-height: 0; }
  #map { flex: 1; min-width: 0; min-height: 320px; background: #d5ddd6; }
  .panel {
    width: 340px;
    max-width: 100%;
    background: #fff;
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .panel-head {
    padding: 12px 14px 8px;
    border-bottom: 1px solid var(--line);
  }
  .count { font-weight: 700; font-size: 15px; margin: 0; }
  .updated { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
  #list { overflow: auto; padding: 6px 8px 16px; }
  #list h2 {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 12px 8px 4px;
  }
  .empty { color: var(--muted); padding: 12px 8px; font-size: 14px; }
  button.row {
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    border-radius: 10px;
    padding: 8px 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    display: block;
  }
  button.row:hover { background: #f3f7f4; }
  button.row.selected { background: #e5f3eb; }
  .row-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .row-price { font-weight: 700; }
  .status {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--green);
  }
  .status-pending { color: #a16207; }
  .status-contingent { color: #7c3aed; }
  .row-addr { font-size: 14px; margin-top: 1px; }
  .row-meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .mini-badges { margin-top: 4px; }
  .legend {
    background: rgba(255,255,255,0.94);
    border-radius: 10px;
    padding: 8px 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    font-size: 12px;
    line-height: 1.35;
    color: var(--ink);
  }
  .legend div { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .swatch {
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid #14532d; background: var(--green); display: inline-block;
  }
  .swatch.water { background: #0891b2; border-color: #155e75; }
  .swatch.west { background: #9cb6a4; border-color: #3d5a45; }
  .swatch.other { background: #94a3b8; border-color: #475569; width: 10px; height: 10px; }
  .swatch.dashed { background: #fff; border-style: dashed; }
  .legend .hint { display: block; color: var(--muted); margin-top: 4px; max-width: 210px; }
  .leaflet-popup-content { margin: 10px 12px; }
  .popup { font-size: 14px; line-height: 1.35; }
  .popup img {
    width: 100%; height: 132px; object-fit: cover; border-radius: 8px;
    display: block; margin: 0 0 8px; background: #e7e1d8;
  }
  .popup h3 { font-size: 15px; margin: 0 0 2px; line-height: 1.3; }
  .popup .place { color: var(--muted); font-size: 12.5px; margin: 0 0 6px; }
  .popup .price { font-weight: 750; font-size: 16px; color: #143126; margin: 0; }
  .popup .facts { margin: 2px 0 8px; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 8px; }
  .badge {
    background: #e6f4ee; color: #14532d; border-radius: 999px;
    padding: 2px 8px; font-size: 11px; font-weight: 700;
  }
  .badge.water { background: #cffafe; color: #155e75; }
  .popup a { color: #0f5c3e; font-weight: 700; }
  .popup .note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .leaflet-interactive { cursor: pointer; }
  @media (max-width: 800px) {
    .layout { flex-direction: column; }
    #map { height: 58vh; flex: none; }
    .panel { width: 100%; height: 42vh; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>

</div>

<script>
(function () {
  var collection = JSON.parse(document.getElementById("map-data").textContent);
  var features = collection.features || [];
  var BADGES = [
    ["waterfront", "Waterfront", true],
    ["pier_or_dock", "Pier / dock", true],
    ["multigenerational", "Multigenerational", false],
    ["detached_adu", "Detached ADU", false],
    ["detached_garage", "Detached garage", false],
    ["basement", "Basement", false],
    ["walkout_basement", "Walkout basement", false],
    ["fenced", "Fenced", false]
  ];

  var map = L.map("map", { scrollWheelZoom: true });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);

  var legend = L.control({ position: "bottomleft" });
  legend.onAdd = function () {
    var div = L.DomUtil.create("div", "legend");
    div.innerHTML =
      '<div><span class="swatch water"></span> Waterfront or pier</div>' +
      '<div><span class="swatch"></span> East of I-95</div>' +
      '<div><span class="swatch west"></span> West of I-95</div>' +
      '<div><span class="swatch other"></span> Other homes</div>' +
      '<div><span class="swatch dashed"></span> Pending or contingent</div>' +
      '<span class="hint">Teal wins when a home is waterfront or has a pier, including west of I-95.</span>';
    L.DomEvent.disableClickPropagation(div);
    return div;
  };
  legend.addTo(map);

  var group = L.featureGroup().addTo(map);
  var markerById = new Map();
  var selectedId = null;

  function fmtPrice(n) {
    if (n == null) return "Price unavailable";
    return Number(n).toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
  }
  function fmtAcres(n) {
    if (n == null) return "";
    var x = Number(n);
    if (!isFinite(x)) return "";
    var s = (x >= 10 ? x.toFixed(1) : x.toFixed(2)).replace(/\.0+$/, "").replace(/(\.\d)0$/, "$1");
    return s + " ac";
  }
  function facts(p) {
    var bits = [];
    if (p.beds != null) bits.push(p.beds + " bd");
    if (p.baths != null) bits.push(p.baths + " ba");
    var acres = fmtAcres(p.acres);
    if (acres) bits.push(acres);
    if (p.sqft != null) bits.push(Number(p.sqft).toLocaleString("en-US") + " sqft");
    return bits.join(" · ");
  }
  function statusClass(status) {
    if (status === "pending" || status === "contingent") return "status status-" + status;
    return "status";
  }
  function statusLabel(status) {
    if (!status) return "";
    return status.charAt(0).toUpperCase() + status.slice(1);
  }
  function sideLabel(v) {
    if (v === 1) return "East of I-95";
    if (v === 0) return "West of I-95";
    return "";
  }
  function safeUrl(u) {
    try {
      var url = new URL(u);
      if (url.protocol === "https:" || url.protocol === "http:") return url.href;
    } catch (e) {}
    return "";
  }
  function haystack(p) {
    return [p.address, p.city, p.county, p.zip, p.status, p.property_type].join(" ").toLowerCase();
  }
  function pinStyle(p) {
    var water = p.waterfront === 1 || p.pier_or_dock === 1;
    var west = p.east_of_i95 === 0;
    var pending = p.status === "pending" || p.status === "contingent";
    var fill, stroke, radius;
    if (water) {
      fill = "#0891b2";
      stroke = "#155e75";
      radius = 11;
    } else if (p.in_default === 1) {
      fill = west ? "#9cb6a4" : "#1f7a4d";
      stroke = west ? "#3d5a45" : "#14532d";
      radius = 9;
    } else {
      fill = west ? "#c4b8a5" : "#94a3b8";
      stroke = "#475569";
      radius = 6;
    }
    return {
      radius: radius,
      color: stroke,
      weight: water ? 2.5 : 2,
      fillColor: fill,
      fillOpacity: p.in_default === 1 || water ? 0.95 : 0.8,
      dashArray: pending ? "3 3" : null
    };
  }
  function badgeNodes(p) {
    var wrap = document.createElement("div");
    wrap.className = "badges";
    BADGES.forEach(function (item) {
      if (p[item[0]] !== 1) return;
      var b = document.createElement("span");
      b.className = item[2] ? "badge water" : "badge";
      b.textContent = item[1];
      wrap.appendChild(b);
    });
    return wrap.childNodes.length ? wrap : null;
  }
  function buildPopup(p) {
    var wrap = document.createElement("div");
    wrap.className = "popup";
    var photo = safeUrl(p.photo_url);
    if (photo) {
      var img = document.createElement("img");
      img.alt = "";
      img.src = photo;
      img.addEventListener("error", function () { img.remove(); });
      wrap.appendChild(img);
    }
    var h = document.createElement("h3");
    h.textContent = p.address || "Address unavailable";
    wrap.appendChild(h);
    var place = document.createElement("p");
    place.className = "place";
    place.textContent = [p.city, p.state || "VA", p.zip].filter(Boolean).join(", ");
    wrap.appendChild(place);
    var price = document.createElement("p");
    price.className = "price";
    price.textContent = fmtPrice(p.price);
    wrap.appendChild(price);
    var fact = document.createElement("p");
    fact.className = "facts";
    var factBits = [facts(p), statusLabel(p.status), sideLabel(p.east_of_i95)].filter(Boolean);
    fact.textContent = factBits.join(" · ");
    wrap.appendChild(fact);
    var badges = badgeNodes(p);
    if (badges) wrap.appendChild(badges);
    if (p.meets_must_haves !== 1) {
      var note = document.createElement("p");
      note.className = "note";
      note.textContent = "Outside the current must-haves.";
      wrap.appendChild(note);
    } else if (p.in_default !== 1) {
      var held = document.createElement("p");
      held.className = "note";
      held.textContent = "Matches the search, but it is not active, contingent, or pending.";
      wrap.appendChild(held);
    }
    var href = safeUrl(p.url);
    if (href) {
      var a = document.createElement("a");
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "View listing";
      wrap.appendChild(a);
    }
    return wrap;
  }

  features.forEach(function (f) {
    var p = f.properties;
    var lon = f.geometry.coordinates[0];
    var lat = f.geometry.coordinates[1];
    var marker = L.circleMarker([lat, lon], pinStyle(p));
    marker.bindPopup(buildPopup(p), { maxWidth: 280, minWidth: 220 });
    var tip = document.createElement("span");
    tip.textContent = (p.address || "Listing") + " · " + fmtPrice(p.price);
    marker.bindTooltip(tip, { direction: "top", offset: [0, -6] });
    marker.on("click", function () { select(p.id); });
    markerById.set(p.id, marker);
  });

  function compare(a, b) {
    var pa = a.properties, pb = b.properties;
    if (pa.in_default !== pb.in_default) return pb.in_default - pa.in_default;
    var priceA = pa.price == null ? Infinity : pa.price;
    var priceB = pb.price == null ? Infinity : pb.price;
    if (priceA !== priceB) return priceA - priceB;
    return String(pa.address || "").localeCompare(String(pb.address || ""));
  }
  function visibleFeatures() {
    var showAll = document.getElementById("show-all").checked;
    var q = document.getElementById("q").value.trim().toLowerCase();
    return features.filter(function (f) {
      var p = f.properties;
      if (p.in_default !== 1 && !showAll) return false;
      if (q && haystack(p).indexOf(q) === -1) return false;
      return true;
    });
  }
  function applyView(fit) {
    var shown = visibleFeatures().slice().sort(compare);
    group.clearLayers();
    shown.forEach(function (f) { group.addLayer(markerById.get(f.properties.id)); });
    renderList(shown);
    var must = shown.filter(function (f) { return f.properties.in_default === 1; }).length;
    var other = shown.length - must;
    var count = document.getElementById("count");
    if (other === 0) {
      count.textContent = must + " must-have home" + (must === 1 ? "" : "s");
    } else {
      count.textContent = must + " must-have · " + other + " other";
    }
    if (fit && group.getLayers().length) {
      map.fitBounds(group.getBounds().pad(0.18), { padding: [24, 24], maxZoom: 12 });
    }
  }
  function renderList(shown) {
    var list = document.getElementById("list");
    list.replaceChildren();
    if (!shown.length) {
      var empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = features.length
        ? "Nothing matches that search."
        : "No listings with coordinates yet.";
      list.appendChild(empty);
      return;
    }
    var mixed = shown.some(function (f) { return f.properties.in_default !== 1; })
      && shown.some(function (f) { return f.properties.in_default === 1; });
    var last = null;
    shown.forEach(function (f) {
      var p = f.properties;
      var bucket = p.in_default === 1 ? "match" : "other";
      if (mixed && bucket !== last) {
        var h = document.createElement("h2");
        h.textContent = bucket === "match" ? "Matches" : "Other homes seen";
        list.appendChild(h);
        last = bucket;
      }
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "row" + (String(selectedId) === String(p.id) ? " selected" : "");
      btn.dataset.id = String(p.id);
      var top = document.createElement("div");
      top.className = "row-top";
      var price = document.createElement("span");
      price.className = "row-price";
      price.textContent = fmtPrice(p.price);
      var st = document.createElement("span");
      st.className = statusClass(p.status);
      st.textContent = statusLabel(p.status);
      top.appendChild(price);
      top.appendChild(st);
      var addr = document.createElement("div");
      addr.className = "row-addr";
      addr.textContent = p.address || "Address unavailable";
      var meta = document.createElement("div");
      meta.className = "row-meta";
      meta.textContent = [p.city, facts(p)].filter(Boolean).join(" · ");
      btn.appendChild(top);
      btn.appendChild(addr);
      btn.appendChild(meta);
      var badges = badgeNodes(p);
      if (badges) {
        badges.classList.add("mini-badges");
        btn.appendChild(badges);
      }
      btn.addEventListener("click", function () { focusListing(p.id); });
      list.appendChild(btn);
    });
  }
  function select(id) {
    selectedId = id;
    var buttons = document.querySelectorAll("#list .row");
    buttons.forEach(function (btn) {
      btn.classList.toggle("selected", btn.dataset.id === String(id));
    });
    var selected = document.querySelector("#list .row.selected");
    if (selected) selected.scrollIntoView({ block: "nearest" });
  }
  function focusListing(id) {
    var marker = markerById.get(id);
    if (!marker) return;
    select(id);
    var ll = marker.getLatLng();
    map.flyTo(ll, Math.max(map.getZoom(), 12), { duration: 0.35 });
    marker.bringToFront();
    marker.openPopup();
  }

  document.getElementById("updated").textContent = collection.generated_label
    ? "Updated " + collection.generated_label
    : "";
  document.getElementById("show-all").addEventListener("change", function () { applyView(false); });
  document.getElementById("q").addEventListener("input", function () { applyView(false); });
  document.getElementById("fit").addEventListener("click", function () { applyView(true); });

  map.setView([37.6, -77.3], 7);
  applyView(true);
})();
</script>
<noscript>This map needs JavaScript to show listing pins.</noscript>
</body>
</html>
